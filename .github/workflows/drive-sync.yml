name: Google Drive Auto-Sync to SSPH

on:
  schedule:
    # Checks your Google Drive folder automatically every 15 minutes (100% free)
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [google-drive-upload]

concurrency:
  group: ssph-google-drive-sync
  cancel-in-progress: false

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare PostgreSQL Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/prepare-prisma-schema.mjs
          npx prisma generate

      - name: Sync Google Drive PDFs (Samples + Page-1 Thumbnails + SEO + ShrinkMe)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          SHRINKME_API_TOKEN: ${{ secrets.SHRINKME_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_AUTO_PUBLISH: ${{ vars.DRIVE_AUTO_PUBLISH || 'false' }}
        run: npm run drive:sync
